[package]
name = "artty"
version = "0.1.0"
description = "A GPU-accelerated terminal for working with AI agents"
license = "Apache-2.0"
edition = "2024"
publish = false

[dependencies]
artty-core = { path = "../artty-core" }
# `artty attach`: the protocol and a terminal's view, without ssh built in.
artty-client = { path = "../artty-client", default-features = false }
artty-server = { path = "../artty-server" }
libc = "0.2"
log = "0.4"
serde_json = "1"

[dev-dependencies]
postcard = { version = "1", features = ["use-std"] }

# The app is macOS only; elsewhere artty is the command and the server.
[target.'cfg(target_os = "macos")'.dependencies]
futures = "0.3"
gpui = { version = "0.2.2", features = ["runtime_shaders"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff", "ico", "qoi"] }
block2 = "0.6"
security-framework = "3"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSBundle", "NSLocale", "NSString", "NSError", "NSProcessInfo"] }
objc2-user-notifications = { version = "0.3", default-features = false, features = ["std", "block2", "bitflags", "UNUserNotificationCenter", "UNNotificationContent", "UNNotificationRequest", "UNNotificationSound", "UNNotificationTrigger"] }
