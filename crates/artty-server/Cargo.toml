[package]
name = "artty-server"
version = "0.1.0"
description = "The artty server: owns terminal sessions so they outlive the app's windows"
license = "Apache-2.0"
edition = "2024"
publish = false

[dependencies]
artty-core = { path = "../artty-core" }
libc = "0.2"
log = "0.4"
# Folders shown in an app's files drawer, watched (inotify; kqueue on macOS).
notify = { version = "8", default-features = false, features = ["macos_kqueue"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["use-std"] }
# Agents' threads and asks, kept across restarts (SQLite built in: the
# Linux builds are cross-compiled).
rusqlite = { version = "0.32", features = ["bundled"] }
