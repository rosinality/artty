[package]
name = "artty-core"
version = "0.1.0"
description = "Terminal sessions for artty: PTY, terminal state, and render snapshots"
license = "Apache-2.0"
edition = "2024"
publish = false

[dependencies]
artty-vt = { path = "../artty-vt" }
log = "0.4"
serde = { version = "1", features = ["derive"] }
toml = "0.9"
libc = "0.2"
serde_json = "1"
toml_edit = "0.25"
postcard = { version = "1", features = ["use-std"] }
