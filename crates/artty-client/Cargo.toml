[package]
name = "artty-client"
version = "0.1.0"
description = "Reaching an artty server from any app (a phone's): ssh built in, the protocol, screens and keys"
license = "Apache-2.0"
edition = "2024"
publish = false

[dependencies]
artty-core = { path = "../artty-core" }
log = "0.4"
serde_json = "1"
libc = "0.2"
russh = { version = "0.65", default-features = false, features = ["ring", "flate2", "rsa"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "macros"] }
