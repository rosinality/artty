[package]
name = "artty-client"
version = "0.1.0"
description = "Reaching an artty server from any app (a phone's): ssh built in, the protocol, screens and keys"
license = "Apache-2.0"
edition = "2024"
publish = false

[dependencies]
artty-core = { path = "../artty-core" }
log = "0.4"
serde_json = "1"
libc = "0.2"
russh = { version = "0.65", default-features = false, features = ["ring", "flate2", "rsa"] }
# Files on a plain ssh machine (the files browser), as SFTP.
russh-sftp = "3"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "macros"] }
# Reaching hosts behind a Cloudflare Tunnel (`ProxyCommand cloudflared access ssh`): ssh in a
# WebSocket over TLS. rustls on ring (as russh), with Mozilla's roots.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
webpki-roots = "1"
# HTTP proxies' logins (a ProxyCommand's).
base64 = "0.22"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }

[dev-dependencies]
p256 = { version = "0.14", features = ["ecdsa", "pkcs8"] }
