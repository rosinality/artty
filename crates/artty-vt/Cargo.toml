[package]
name = "artty-vt"
version = "0.1.0"
description = "Terminal emulation core for artty, forked from alacritty_terminal"
license = "Apache-2.0"
edition = "2024"
publish = false

[features]
default = ["serde"]
serde = ["dep:serde", "bitflags/serde"]

[dependencies]
arrayvec = { version = "0.7.2", features = ["serde"] }
base64 = "0.22.0"
imagesize = "0.13"
miniz_oxide = { version = "0.8", features = ["with-alloc"] }
bitflags = "2.4.1"
cursor-icon = { version = "1.0.0", default-features = false }
home = "0.5.5"
libc = "0.2"
log = "0.4"
memchr = "2.7.4"
parking_lot = "0.12.0"
polling = "3.8.0"
regex-automata = "0.4.3"
unicode-width = "0.2.0"
serde = { version = "1", features = ["derive", "rc"], optional = true }

[target.'cfg(unix)'.dependencies]
rustix-openpty = "0.2.0"
rustix = { version = "1.0.0", default-features = false, features = ["std"] }
signal-hook = "0.4.3"

[target.'cfg(windows)'.dependencies]
piper = "0.2.1"
miow = "0.6.0"
windows-sys = { version = "0.59.0", features = [
    "Win32_System_Console",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
]}

[dev-dependencies]
serde_json = "1.0.0"
