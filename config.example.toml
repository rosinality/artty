# artty configuration. Copy to ~/.config/artty/config.toml and edit.
# Every key is optional; the values below are the defaults.
# Changes apply the next time artty starts.

# Program for new tabs. Empty runs your account's login shell.
# shell = ["/opt/homebrew/bin/fish", "--login"]
shell = []

# Font families, tried in order. "SF Mono" is the macOS system monospaced font.
font-family = ["SF Mono", "Menlo"]
font-size = 13          # ⌘= / ⌘- / ⌘0 change it for the session
line-height = 1.35      # multiple of the font size

# Background: opacity of the terminal color over the desktop (1 = opaque),
# and whether what shows through is blurred.
background-opacity = 0.72
background-blur = true

scrollback = 10000

# Option acts as Meta (⌥B sends ESC b, for shell word movement).
# Set to false to type characters like å or ∑ with Option.
option-as-meta = true

cursor-blink = true
# block, bar, underline or hollow. Programs can still change it while they run
# (vim's insert mode, for example).
cursor-style = "block"

# The bell flashes the pane; it can also play the system alert sound. A bell
# in a pane you can't see marks it in the sidebar and notifies instead.
visual-bell = true
bell-sound = false

# Copy text to the clipboard as soon as it's selected.
copy-on-select = false

# In the sidebar, a tab with split panes lists them, a line each (a tab you
# named keeps its own line above them); false shows one line, for the focused
# pane.
list-panes = true

# How the sidebar shows workspaces: "list" (every workspace with its tabs),
# "accordion" (only the current one open; the others one line each, with what
# needs you there), or "switcher" (only the current one's tabs, under a button
# listing the others).
sidebar-style = "list"

# Ask before pasting several lines into a program that would run them one by
# one: one that hasn't turned on bracketed paste (shells and editors usually
# have, so they get the paste whole).
confirm-multiline-paste = true

# macOS's secure keyboard entry: while an artty window is in front, other
# apps can't read what you type (passwords, say). Also in the artty menu.
secure-keyboard-entry = false

# On other machines' panes with a noticeable round trip, show what you type
# at once, before the echo comes back (as mosh does). Each guess is checked
# against what the server then shows; after an Enter nothing shows until one
# is confirmed, so passwords typed where nothing echoes never appear.
local-echo = true

# Forward other machines' ports to this Mac as soon as their programs start
# listening (a dev server's port, say). Off, the sidebar and Activity show
# them, to forward with a click.
auto-forward-ports = false

# Foreground programs shown as coding agents in the sidebar.
agents = ["claude", "codex", "gemini", "aider", "opencode", "amp", "goose", "cursor-agent", "qwen", "crush", "droid"]

# macOS notifications when a tab needs you while you're in another tab or app.
notifications = true

# Set up zsh and bash to report prompts, commands and exit codes (for
# `artty run`, command status and notifications). fish does this natively.
shell-integration = true

# Reopen the previous tabs on launch: their directories, recent output, and
# programs. Saved every few seconds and on quit (owner-only file in
# ~/Library/Application Support/artty/state.json).
restore-sessions = true
# Lines of each tab's output to save; 0 saves none.
restore-scrollback = 1000
# Resume coding agents that were running in restored tabs.
resume-agents = true

# How to resume an agent, by name. `session` is used when the agent's hooks
# reported its conversation id ({session}); `latest` otherwise. Claude Code,
# Codex and Gemini CLI are built in; add others the same way.
[resume.claude]
session = "claude --resume {session}"
latest = "claude --continue"

[resume.codex]
session = "codex resume {session}"
latest = "codex resume --last"

[resume.gemini]
session = "gemini --resume {session}"
latest = "gemini --resume latest"

[colors]
# foreground = "#d8dee9"
# background = "#161a22"
# cursor = "#e6e6e6"
# selection = "#3d5a8a"
# search-match = "#6b5a2a"
# The 16 ANSI colors: black, red, green, yellow, blue, magenta, cyan, white,
# then their bright versions. A shorter list overrides only the first ones.
# palette = [
#   "#3b4252", "#e06c75", "#9ece6a", "#e0af68", "#7aa2f7", "#bb9af7", "#7dcfff", "#d8dee9",
#   "#616e88", "#f7768e", "#b9f27c", "#ffc777", "#8fb4ff", "#c7a9ff", "#a4e0ff", "#eceff4",
# ]

# Key bindings over the defaults: keystrokes to an action, "none" (takes a
# default binding away) or text to type. Keystrokes are modifiers (cmd,
# ctrl, alt, shift) and a key joined by `-`; several, separated by spaces,
# make a sequence. Changes apply as soon as the file is saved.
[keys]
# "cmd-shift-t" = "new-tab"
# "cmd-t" = "none"
# "shift-enter" = { send = "\u001b[13;2u" }
# "ctrl-a c" = "new-tab"
#
# Actions: new-window, new-tab, close-tab, close-pane, next-tab,
# previous-tab, rename-tab, move-tab-up, move-tab-down, new-workspace,
# open-workspace, next-workspace, previous-workspace, show-activity,
# split-right, split-down, focus-left, focus-right, focus-up, focus-down,
# next-pane, previous-pane, toggle-zoom, jump-to-attention, copy, paste,
# find, find-next, find-previous, increase-font-size, decrease-font-size,
# reset-font-size, jump-to-previous-prompt, jump-to-next-prompt,
# copy-command-output, copy-mode, resize-pane-left, resize-pane-right,
# resize-pane-up, resize-pane-down, swap-pane-left, swap-pane-right,
# swap-pane-up, swap-pane-down, equalize-panes, pane-to-new-tab,
# toggle-broadcast, reopen-closed-tab, toggle-secure-keyboard-entry,
# open-settings, reopen-closed-windows, restart-to-update, restart-server,
# quit, quit-and-end-sessions.
# (⌘1–⌘9 always select tabs.)

# Other machines' artty servers, shown in the sidebar under their names
# beside this Mac's: their workspaces and tabs work as local ones do, and
# keep running there when the connection drops (artty reconnects by itself).
# artty must be installed there; the connection is ssh running
# `artty server --stdio`, with your ssh config and keys (no password
# prompts: use a key or an agent).
# [[servers]]
# name = "devbox"
# ssh = "me@devbox"               # or a Host from ~/.ssh/config
# artty = "~/.local/bin/artty"    # if it isn't on the login shell's PATH
#
# Or any command that reaches a server on its stdin and stdout, e.g. a
# second server on this Mac, to try it out:
# [[servers]]
# name = "Second"
# command = ["sh", "-c", "mkdir -p /tmp/artty-second && TMPDIR=/tmp/artty-second/ XDG_STATE_HOME=/tmp/artty-second/state exec /Applications/artty.app/Contents/MacOS/artty server --stdio"]
